<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"
     aria-label="A pipeline: three systemd services (one down) feed a Rust exporter that exposes Prometheus metrics, which Grafana alerts on.">
  <title>Systemd Prometheus Exporter — service health to Prometheus, alerting in Grafana</title>
  <rect width="640" height="400" fill="#FAFAF9"/>

  <defs>
    <marker id="se-arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E0E10"/>
    </marker>
    <marker id="se-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E3AFF"/>
    </marker>
  </defs>

  <!-- arrows: systemd services -> exporter -->
  <g fill="none" stroke="#0E0E10" stroke-width="1.5">
    <line x1="184" y1="113" x2="246" y2="166" marker-end="url(#se-arrow-ink)"/>
    <line x1="184" y1="185" x2="246" y2="188" marker-end="url(#se-arrow-ink)"/>
  </g>
  <!-- the failing unit's signal, highlighted -->
  <line x1="184" y1="257" x2="246" y2="212" fill="none" stroke="#1E3AFF" stroke-width="1.8"
        marker-end="url(#se-arrow-accent)"/>

  <!-- systemd service units (left) -->
  <g font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0E0E10">
    <rect x="32" y="90"  width="152" height="46" rx="8" fill="#FFFFFF" stroke="#8A8A90" stroke-width="1.5"/>
    <circle cx="54" cy="113" r="5" fill="#0E0E10"/>
    <text x="72" y="118">nginx.service</text>

    <rect x="32" y="162" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#8A8A90" stroke-width="1.5"/>
    <circle cx="54" cy="185" r="5" fill="#0E0E10"/>
    <text x="72" y="190">sshd.service</text>

    <rect x="32" y="234" width="152" height="46" rx="8" fill="#FFFFFF" stroke="#8A8A90" stroke-width="1.5"/>
    <circle cx="54" cy="257" r="5" fill="none" stroke="#1E3AFF" stroke-width="2"/>
    <text x="72" y="262">redis.service</text>
  </g>

  <!-- exporter (the project — highlighted) -->
  <rect x="250" y="142" width="150" height="96" rx="12" fill="#E7ECFF" stroke="#1E3AFF" stroke-width="2.5"/>
  <text x="325" y="184" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-weight="500" font-size="16" fill="#0E0E10">exporter</text>
  <text x="325" y="208" text-anchor="middle" font-family="'IBM Plex Mono', monospace"
        font-size="13" fill="#1E3AFF">:9100/metrics</text>

  <!-- exporter -> Prometheus (scrape) -->
  <line x1="400" y1="176" x2="456" y2="148" fill="none" stroke="#0E0E10" stroke-width="1.5"
        marker-end="url(#se-arrow-ink)"/>

  <!-- Prometheus -->
  <rect x="460" y="122" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#0E0E10" stroke-width="1.5"/>
  <text x="535" y="151" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-weight="500" font-size="14" fill="#0E0E10">Prometheus</text>

  <!-- Prometheus -> Grafana -->
  <line x1="535" y1="170" x2="535" y2="222" fill="none" stroke="#0E0E10" stroke-width="1.5"
        marker-end="url(#se-arrow-ink)"/>

  <!-- Grafana (alerting) -->
  <rect x="460" y="224" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#0E0E10" stroke-width="1.5"/>
  <circle cx="592" cy="236" r="4.5" fill="#1E3AFF"/>
  <text x="527" y="253" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-weight="500" font-size="14" fill="#0E0E10">Grafana</text>

  <!-- caption -->
  <text x="325" y="332" text-anchor="middle" font-family="'IBM Plex Mono', monospace"
        font-size="12" fill="#8A8A90">alerts on service_up == 0</text>
</svg>
